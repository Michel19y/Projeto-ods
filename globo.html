<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore o mapa mundial interativo com dados de acesso à água potável por país — AquaVida." />
  <title>AquaVida | Mapa da Água no Mundo</title>
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { overflow: hidden; height: 100%; }

    .globe-wrapper {
      position: relative;
      height: calc(100vh - 73px);
      background: #000d1a;
      overflow: hidden;
    }

    #globeViz {
      position: absolute;
      inset: 0;
    }

    /* ---- PAINEL LATERAL ---- */
    .painel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 360px;
      background: rgba(4, 14, 30, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid rgba(66, 165, 245, 0.25);
      color: #e0f0ff;
      z-index: 20;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .painel.ativo {
      transform: translateX(0);
    }

    .painel-topo {
      padding: 1.5rem 1.5rem 0;
      position: sticky;
      top: 0;
      background: rgba(4, 14, 30, 0.97);
      border-bottom: 1px solid rgba(66, 165, 245, 0.15);
      z-index: 1;
    }

    .btn-fechar {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      color: #90caf9;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .btn-fechar:hover { background: rgba(229, 57, 53, 0.5); color: #fff; }

    .painel-pais-nome {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
      padding-right: 2rem;
    }

    .painel-pais-nivel {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.5px;
    }

    .nivel-otimo    { background: #1b5e20; color: #a5d6a7; }
    .nivel-bom      { background: #1a3e1a; color: #81c784; }
    .nivel-moderado { background: #4a2a00; color: #ffcc80; }
    .nivel-ruim     { background: #4a1500; color: #ffab91; }
    .nivel-critico  { background: #3b0000; color: #ef9a9a; }
    .nivel-sem-dados{ background: #1a2a3a; color: #90a4ae; }

    .painel-corpo {
      padding: 1.25rem 1.5rem 2rem;
    }

    /* Barras de progresso */
    .metrica {
      margin-bottom: 1.25rem;
    }

    .metrica-titulo {
      font-size: 0.8rem;
      font-weight: 600;
      color: #90caf9;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 0.4rem;
    }

    .metrica-valor-linha {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }

    .metrica-num {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      min-width: 55px;
    }

    .barra-fundo {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .barra-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.7s ease;
    }

    .metrica-detalhe {
      font-size: 0.78rem;
      color: #607d8b;
    }

    .divisor {
      border: none;
      border-top: 1px solid rgba(66, 165, 245, 0.15);
      margin: 1.25rem 0;
    }

    .painel-resumo {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #b0bec5;
    }

    .painel-fonte {
      font-size: 0.75rem;
      color: #546e7a;
      margin-top: 1rem;
    }

    .painel-sem-dados {
      padding: 2rem;
      text-align: center;
      color: #546e7a;
    }

    .painel-sem-dados i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 1rem;
      color: #37474f;
    }

    /* ---- LEGENDA ---- */
    .legenda {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      background: rgba(4, 14, 30, 0.85);
      border: 1px solid rgba(66, 165, 245, 0.2);
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      z-index: 10;
      color: #b0bec5;
    }

    .legenda-titulo {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #78909c;
      margin-bottom: 0.6rem;
    }

    .legenda-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      margin-bottom: 0.3rem;
      color: #90a4ae;
    }

    .legenda-cor {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ---- DICA ---- */
    .globe-hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(4, 14, 30, 0.8);
      border: 1px solid rgba(66, 165, 245, 0.2);
      border-radius: 20px;
      padding: 0.4rem 1.1rem;
      font-size: 0.8rem;
      color: #78909c;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ---- LOADING ---- */
    #globe-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: #000d1a;
      gap: 1rem;
      color: #90caf9;
    }

    #globe-loading i {
      font-size: 2.5rem;
    }

    #globe-loading p {
      font-size: 1rem;
    }

    /* ---- TOOLTIP ---- */
    #tooltip-globo {
      position: absolute;
      pointer-events: none;
      background: rgba(4, 14, 30, 0.9);
      border: 1px solid rgba(66, 165, 245, 0.3);
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      font-size: 0.82rem;
      color: #e0f0ff;
      z-index: 25;
      white-space: nowrap;
      display: none;
    }

    /* ---- RESPONSIVIDADE ---- */
    @media (max-width: 768px) {
      .globe-wrapper { height: calc(100vh - 105px); }

      .painel {
        top: auto;
        width: 100%;
        height: 55vh;
        border-left: none;
        border-top: 1px solid rgba(66, 165, 245, 0.25);
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .painel.ativo { transform: translateY(0); }

      .legenda { display: none; }

      .globe-hint {
        bottom: 0.75rem;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <img src="img/ifsc-logo.png" alt="Logo do IFSC" class="logo-img" />
      <a href="index.html" class="logo">
        <i class="fa-solid fa-droplet logo-icon"></i>
        <span class="logo-text">Aqua<span>Vida</span></span>
      </a>
      <nav aria-label="Menu principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="ods.html">Os ODS</a></li>
          <li><a href="globo.html" class="ativo">Mapa Mundial</a></li>
          <li><a href="formulario.html">Cadastrar Ideia</a></li>
          <li><a href="resultados.html">Ideias Cadastradas</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="globe-wrapper">

    <div id="globeViz"></div>

    <div id="tooltip-globo"></div>

    <!-- Painel lateral de informações -->
    <div id="painel" class="painel" role="complementary" aria-label="Informações do país">
      <div class="painel-topo">
        <button class="btn-fechar" id="btn-fechar-painel" aria-label="Fechar painel">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="painel-nome" class="painel-pais-nome"></div>
        <span id="painel-nivel" class="painel-pais-nivel"></span>
      </div>
      <div class="painel-corpo" id="painel-corpo"></div>
    </div>

    <!-- Legenda de cores -->
    <div class="legenda" aria-label="Legenda do mapa">
      <div class="legenda-titulo">% com água segura</div>
      <div class="legenda-item"><div class="legenda-cor" style="background:#1b5e20"></div> ≥ 95% — Excelente</div>
      <div class="legenda-item"><div class="legenda-cor" style="background:#388e3c"></div> 85–94% — Bom</div>
      <div class="legenda-item"><div class="legenda-cor" style="background:#f9a825"></div> 70–84% — Moderado</div>
      <div class="legenda-item"><div class="legenda-cor" style="background:#e64a19"></div> 50–69% — Crítico</div>
      <div class="legenda-item"><div class="legenda-cor" style="background:#b71c1c"></div> &lt; 50% — Grave</div>
      <div class="legenda-item"><div class="legenda-cor" style="background:#37474f"></div> Sem dados</div>
    </div>

    <div class="globe-hint">
      <i class="fa-solid fa-hand-pointer"></i> Clique em um país para ver os dados
    </div>

    <div id="globe-loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p>Carregando mapa mundial...</p>
    </div>

  </div>

  <script src="//unpkg.com/globe.gl"></script>
  <script>
  // ============================================================
  // DADOS DE ÁGUA POR PAÍS  (JMP WHO/UNICEF 2022, FAO, SNIS 2022)
  // aguaSegura = % com acesso a água potável gerida de forma segura
  // saneamento = % com saneamento básico adequado
  // ============================================================
  const dados = {
    // AMÉRICAS
    BRA: { nome:'Brasil',          aguaSegura:87, saneamento:56,  semAgua:'28 milhões', resumo:'O Brasil enfrenta profunda desigualdade regional. Enquanto áreas urbanas têm cobertura razoável, comunidades rurais, ribeirinhas e periferias ainda carecem de água tratada e esgoto. Segundo o SNIS 2022, apenas 56% da população tem coleta de esgoto.',                                                         fonte:'SNIS 2022 / JMP WHO-UNICEF 2022' },
    ARG: { nome:'Argentina',       aguaSegura:90, saneamento:91,  semAgua:'4,4 milhões', resumo:'A Argentina tem boa cobertura urbana, mas regiões como o Norte e o Chaco ainda enfrentam déficits significativos de saneamento e qualidade da água em comunidades rurais.',                                                                                                                                        fonte:'JMP WHO-UNICEF 2022' },
    COL: { nome:'Colômbia',        aguaSegura:91, saneamento:86,  semAgua:'4,5 milhões', resumo:'A Colômbia avançou na cobertura urbana, mas áreas rurais e comunidades indígenas ainda sofrem com escassez hídrica. A poluição de rios por garimpo ilegal e agropecuária é crescente.',                                                                                                                            fonte:'JMP WHO-UNICEF 2022' },
    MEX: { nome:'México',          aguaSegura:89, saneamento:73,  semAgua:'13 milhões',  resumo:'O México tem cobertura elevada nas cidades, mas 13 milhões vivem sem acesso adequado. A Cidade do México enfrenta crise hídrica severa — extrai mais água do que seu lençol freático pode repor.',                                                                                                                 fonte:'JMP WHO-UNICEF 2022' },
    CHL: { nome:'Chile',           aguaSegura:96, saneamento:99,  semAgua:'700 mil',     resumo:'O Chile tem uma das melhores coberturas da América do Sul, mas enfrenta seca prolongada no centro-norte. Algumas cidades já dependem de caminhões-pipa para abastecimento.',                                                                                                                                        fonte:'JMP WHO-UNICEF 2022' },
    PER: { nome:'Peru',            aguaSegura:88, saneamento:72,  semAgua:'3,6 milhões', resumo:'Apesar das melhorias nas cidades, comunidades andinas e amazônicas ainda carecem de serviços básicos. O derretimento de geleiras ameaça o abastecimento futuro de cidades como Lima.',                                                                                                                             fonte:'JMP WHO-UNICEF 2022' },
    ECU: { nome:'Equador',         aguaSegura:83, saneamento:74,  semAgua:'2,8 milhões', resumo:'O Equador avançou na cobertura urbana, mas comunidades indígenas e rurais ainda enfrentam acesso precário. Contaminação por petróleo na Amazônia é um problema persistente.',                                                                                                                                       fonte:'JMP WHO-UNICEF 2022' },
    BOL: { nome:'Bolívia',         aguaSegura:72, saneamento:50,  semAgua:'3,4 milhões', resumo:'Glaciares andinos que abastecem cidades como La Paz estão em retração acelerada, ameaçando o fornecimento de água. A Bolívia enfrenta um dos piores cenários de segurança hídrica da América do Sul.',                                                                                                             fonte:'JMP WHO-UNICEF 2022' },
    PRY: { nome:'Paraguai',        aguaSegura:84, saneamento:80,  semAgua:'1,1 milhão',  resumo:'O Paraguai tem acesso razoável, mas a qualidade da água em áreas rurais e a cobertura de saneamento precisam melhorar. O Rio Paraguai enfrenta poluição crescente por agronegócio.',                                                                                                                              fonte:'JMP WHO-UNICEF 2022' },
    URY: { nome:'Uruguai',         aguaSegura:99, saneamento:97,  semAgua:'20 mil',      resumo:'O Uruguai tem uma das melhores coberturas de água e saneamento da América Latina, com acesso quase universal. Em 2023, enfrentou uma crise inédita: seca severa fez o cloro no abastecimento de Montevidéu subir acima do recomendado.',                                                                            fonte:'JMP WHO-UNICEF 2022' },
    VEN: { nome:'Venezuela',       aguaSegura:93, saneamento:93,  semAgua:'2,2 milhões', resumo:'A crise econômica deteriorou seriamente a infraestrutura hídrica. Cortes de água são frequentes nas principais cidades. Em bairros populares de Caracas, a água chega apenas alguns dias por semana.',                                                                                                             fonte:'JMP WHO-UNICEF 2022' },
    CRI: { nome:'Costa Rica',      aguaSegura:97, saneamento:95,  semAgua:'120 mil',     resumo:'A Costa Rica é referência regional com alta cobertura hídrica, impulsionada por políticas de conservação florestal que protegem mananciais. É o único país tropical com mais de 50% de florestas.',                                                                                                                fonte:'JMP WHO-UNICEF 2022' },
    PAN: { nome:'Panamá',          aguaSegura:94, saneamento:77,  semAgua:'230 mil',     resumo:'O Canal do Panamá depende do Rio Chagres para funcionar e abastecer 2 milhões de pessoas. A seca de 2023–24 forçou restrições severas de trânsito no Canal, impactando o comércio global.',                                                                                                                        fonte:'JMP WHO-UNICEF 2022' },
    HTI: { nome:'Haiti',           aguaSegura:53, saneamento:34,  semAgua:'5,3 milhões', resumo:'O Haiti enfrenta grave crise hídrica. É o país mais pobre das Américas, com mais da metade da população sem acesso à água potável segura. Surtos de cólera — reintroduzido por forças de paz da ONU em 2010 — ainda ocorrem.',                                                                                     fonte:'JMP WHO-UNICEF 2022' },
    USA: { nome:'Estados Unidos',  aguaSegura:99, saneamento:99,  semAgua:'500 mil',     resumo:'Os EUA têm cobertura elevada, mas a contaminação por chumbo (crise de Flint, Michigan), poluição de aquíferos por agroquímicos e a seca no Oeste ameaçam a segurança hídrica de milhões.',                                                                                                                         fonte:'JMP WHO-UNICEF 2022' },
    CAN: { nome:'Canadá',          aguaSegura:99, saneamento:99,  semAgua:'100 mil',     resumo:'O Canadá possui as maiores reservas de água doce do mundo, mas comunidades indígenas (Primeiras Nações) ainda sofrem com avisos prolongados de não beber a água da torneira — algumas por mais de 25 anos consecutivos.',                                                                                           fonte:'JMP WHO-UNICEF 2022' },
    GTM: { nome:'Guatemala',       aguaSegura:81, saneamento:56,  semAgua:'3,3 milhões', resumo:'Comunidades indígenas maias no altiplano sofrem com falta de água tratada e saneamento. Contaminação por agrotóxicos em rios é crescente, afetando a saúde de populações ribeirinhas.',                                                                                                                            fonte:'JMP WHO-UNICEF 2022' },
    HND: { nome:'Honduras',        aguaSegura:80, saneamento:62,  semAgua:'1,9 milhão',  resumo:'Honduras tem cobertura desigual, com áreas rurais e bairros informais das cidades enfrentando escassez grave. O desmatamento acelerado destrói mananciais.',                                                                                                                                                       fonte:'JMP WHO-UNICEF 2022' },
    CUB: { nome:'Cuba',            aguaSegura:94, saneamento:91,  semAgua:'600 mil',     resumo:'Cuba tem boa cobertura básica, mas a infraestrutura envelhecida gera interrupções frequentes. A seca de 2024 foi a mais severa em décadas, afetando o abastecimento de Havana.',                                                                                                                                   fonte:'JMP WHO-UNICEF 2022' },
    DOM: { nome:'Rep. Dominicana', aguaSegura:86, saneamento:86,  semAgua:'1,3 milhão',  resumo:'A República Dominicana avançou na cobertura, mas a qualidade da água e o gerenciamento de resíduos hídricos ainda são desafios, especialmente em assentamentos informais.',                                                                                                                                        fonte:'JMP WHO-UNICEF 2022' },

    // EUROPA
    DEU: { nome:'Alemanha',        aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'A Alemanha tem acesso universal e padrões rigorosos de qualidade. Lidera em tecnologias de eficiência hídrica e reúso de água. A seca de 2018–2020 foi a mais severa em 500 anos.',                                                                                                                               fonte:'JMP WHO-UNICEF 2022' },
    FRA: { nome:'França',          aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'A França possui acesso universal e é líder mundial em tratamento de esgoto. A seca de 2022 foi a mais severa em décadas, secando rios e gerando apagões nas usinas nucleares que dependem de água para resfriamento.',                                                                                             fonte:'JMP WHO-UNICEF 2022' },
    GBR: { nome:'Reino Unido',     aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'O Reino Unido tem acesso universal, mas em 2023 empresas de água foram multadas por lançar bilhões de litros de esgoto não tratado em rios e praias — escândalo que gerou investigações parlamentares.',                                                                                                            fonte:'JMP WHO-UNICEF 2022' },
    ESP: { nome:'Espanha',         aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'A Espanha tem acesso universal, mas a seca crônica no sul e leste ameaça o abastecimento. A região de Barcelona chegou a importar água por navio. Conflitos entre regiões pela água são frequentes.',                                                                                                              fonte:'JMP WHO-UNICEF 2022' },
    ITA: { nome:'Itália',          aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'A Itália tem acesso universal, mas perde até 42% da água tratada por vazamentos na rede pública — uma das piores taxas da Europa. O Rio Pó, o maior da Itália, atingiu mínimas históricas em 2022.',                                                                                                              fonte:'JMP WHO-UNICEF 2022' },
    PRT: { nome:'Portugal',        aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'Portugal tem acesso universal, mas enfrenta secas crescentes, especialmente no Alentejo e Algarve. Em 2023, os principais reservatórios do sul do país estavam abaixo de 40% da capacidade.',                                                                                                                      fonte:'JMP WHO-UNICEF 2022' },
    NLD: { nome:'Países Baixos',   aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'Referência mundial em gestão hídrica. Dois terços do país estão abaixo do nível do mar — o controle da água é questão de sobrevivência nacional. Exportam tecnologia hídrica para o mundo inteiro.',                                                                                                               fonte:'JMP WHO-UNICEF 2022' },
    SWE: { nome:'Suécia',          aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'A Suécia tem acesso universal e altíssimos padrões de qualidade. É um dos países mais avançados em sustentabilidade hídrica e reciclagem de água.',                                                                                                                                                                fonte:'JMP WHO-UNICEF 2022' },
    NOR: { nome:'Noruega',         aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'A Noruega tem imensos recursos hídricos e acesso universal de altíssima qualidade. Sua energia hidrelétrica abastece praticamente 100% da eletricidade do país.',                                                                                                                                                   fonte:'JMP WHO-UNICEF 2022' },
    CHE: { nome:'Suíça',           aguaSegura:99, saneamento:99,  semAgua:'0',           resumo:'A Suíça abriga grandes reservas hídricas nos Alpes que abastecem parte da Europa. Tem os mais altos padrões de qualidade de água do mundo.',                                                                                                                                                                        fonte:'JMP WHO-UNICEF 2022' },
    POL: { nome:'Polônia',         aguaSegura:97, saneamento:98,  semAgua:'600 mil',     resumo:'A Polônia tem boa cobertura, mas enfrenta poluição severa de rios por agropecuária e indústria. Em 2022, o Rio Óder teve uma mortandade massiva de peixes por algas tóxicas.',                                                                                                                                     fonte:'JMP WHO-UNICEF 2022' },
    ROU: { nome:'Romênia',         aguaSegura:87, saneamento:77,  semAgua:'2,6 milhões', resumo:'A Romênia é um dos países da UE com maior déficit hídrico. Comunidades rurais ainda carecem de acesso à água encanada e saneamento adequado.',                                                                                                                                                                     fonte:'JMP WHO-UNICEF 2022' },
    UKR: { nome:'Ucrânia',         aguaSegura:95, saneamento:72,  semAgua:'2 milhões',   resumo:'O conflito com a Rússia destruiu infraestruturas hídricas. A destruição da barragem de Kakhovka em 2023 causou inundações catastróficas e contaminou fontes de água para dezenas de milhões.',                                                                                                                     fonte:'JMP WHO-UNICEF 2022' },
    RUS: { nome:'Rússia',          aguaSegura:91, saneamento:79,  semAgua:'13 milhões',  resumo:'A Rússia possui as maiores reservas de água doce do mundo (o Lago Baikal sozinho tem 20% do total global), mas muitas regiões rurais carecem de água segura. Poluição industrial é grave em diversas bacias.',                                                                                                     fonte:'JMP WHO-UNICEF 2022' },

  // ============================================================
  // FUNÇÕES AUXILIARES
  // ============================================================
  function getCorPorCobertura(pct) {
    if (pct == null)  return '#2e3f50';
    if (pct >= 95)    return '#1b5e20';
    if (pct >= 85)    return '#2e7d32';
    if (pct >= 70)    return '#e65100';
    if (pct >= 50)    return '#bf360c';
    return '#7f0000';
  }

  function getCorHover(pct) {
    if (pct == null)  return '#4a6380';
    if (pct >= 95)    return '#43a047';
    if (pct >= 85)    return '#66bb6a';
    if (pct >= 70)    return '#ffa726';
    if (pct >= 50)    return '#ff7043';
    return '#ef5350';
  }

  function getNivelTexto(pct) {
    if (pct == null)  return ['Sem dados', 'nivel-sem-dados'];
    if (pct >= 95)    return ['Excelente', 'nivel-otimo'];
    if (pct >= 85)    return ['Bom', 'nivel-bom'];
    if (pct >= 70)    return ['Moderado', 'nivel-moderado'];
    if (pct >= 50)    return ['Crítico', 'nivel-ruim'];
    return ['Grave', 'nivel-critico'];
  }

  function getCorBarra(pct) {
    if (pct >= 85) return 'linear-gradient(90deg, #2e7d32, #66bb6a)';
    if (pct >= 70) return 'linear-gradient(90deg, #e65100, #ffa726)';
    if (pct >= 50) return 'linear-gradient(90deg, #b71c1c, #ef5350)';
    return 'linear-gradient(90deg, #7f0000, #c62828)';
  }

  function getISO(feat) {
    const p = feat.properties;
    return p.ISO_A3 || p.ADM0_A3 || p.iso_a3 || '';
  }

  // ============================================================
  // INICIALIZAÇÃO DO GLOBO
  // ============================================================
  const wrapper    = document.querySelector('.globe-wrapper');
  const loadingEl  = document.getElementById('globe-loading');
  const painelEl   = document.getElementById('painel');
  const painelNome = document.getElementById('painel-nome');
  const painelNivel= document.getElementById('painel-nivel');
  const painelCorpo= document.getElementById('painel-corpo');
  const tooltipEl  = document.getElementById('tooltip-globo');

  let hoveredPolygon = null;

  const myGlobe = Globe({ animateIn: true })(document.getElementById('globeViz'))
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
    .width(wrapper.clientWidth)
    .height(wrapper.clientHeight)
    .showAtmosphere(true)
    .atmosphereColor('#1565c0')
    .atmosphereAltitude(0.18);

  // Auto-rotação
  myGlobe.controls().autoRotate = true;
  myGlobe.controls().autoRotateSpeed = 0.6;

  // Parar rotação quando o usuário interage
  wrapper.addEventListener('pointerdown', () => {
    myGlobe.controls().autoRotate = false;
  });

  // Tooltip de hover
  wrapper.addEventListener('mousemove', (e) => {
    if (!tooltipEl.textContent) return;
    tooltipEl.style.left = (e.clientX + 14) + 'px';
    tooltipEl.style.top  = (e.clientY - wrapper.getBoundingClientRect().top - 10) + 'px';
  });

  // Resize
  window.addEventListener('resize', () => {
    myGlobe.width(wrapper.clientWidth).height(wrapper.clientHeight);
  });

  // Carregar GeoJSON dos países
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
    .then(r => r.json())
    .then(world => {
      loadingEl.style.display = 'none';

      myGlobe
        .polygonsData(world.features)
        .polygonAltitude(feat => feat === hoveredPolygon ? 0.08 : 0.01)
        .polygonCapColor(feat => {
          const iso = getISO(feat);
          const d   = dados[iso];
          const cor = getCorPorCobertura(d ? d.aguaSegura : null);
          return feat === hoveredPolygon ? getCorHover(d ? d.aguaSegura : null) : cor;
        })
        .polygonSideColor(() => 'rgba(13, 59, 110, 0.3)')
        .polygonStrokeColor(() => 'rgba(255,255,255,0.08)')
        .polygonLabel(feat => {
          const iso = getISO(feat);
          const d   = dados[iso];
          const nome = d ? d.nome : (feat.properties.ADMIN || feat.properties.name || iso);
          const pct  = d ? `${d.aguaSegura}% com água segura` : 'Clique para ver dados';
          return `<div style="background:rgba(4,14,30,.9);border:1px solid rgba(66,165,245,.3);border-radius:6px;padding:6px 10px;font-size:13px;color:#e0f0ff;max-width:180px"><b>${nome}</b><br><span style="color:#90caf9">${pct}</span></div>`;
        })
        .onPolygonHover(feat => {
          hoveredPolygon = feat;
          myGlobe.polygonAltitude(f => f === feat ? 0.08 : 0.01);
          if (feat) {
            const iso = getISO(feat);
            const d   = dados[iso];
            const nome = d ? d.nome : (feat.properties.ADMIN || feat.properties.name || iso);
            tooltipEl.textContent = nome;
            tooltipEl.style.display = 'block';
          } else {
            tooltipEl.style.display = 'none';
          }
        })
        .onPolygonClick(feat => {
          const iso = getISO(feat);
          const d   = dados[iso];
          mostrarPainel(feat, d);
          myGlobe.controls().autoRotate = false;
        });
    })
    .catch(() => {
      loadingEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><p>Erro ao carregar o mapa.<br>Verifique sua conexão com a internet.</p>';
    });

  // ============================================================
  // PAINEL DE INFORMAÇÕES
  // ============================================================
  function mostrarPainel(feat, d) {
    const nomeEn = feat.properties.ADMIN || feat.properties.name || getISO(feat);
    const nome   = d ? d.nome : nomeEn;

    painelEl.classList.add('ativo');
    painelNome.textContent = nome;

    if (!d) {
      const [txt, cls] = getNivelTexto(null);
      painelNivel.textContent = txt;
      painelNivel.className   = 'painel-pais-nivel ' + cls;
      painelCorpo.innerHTML   = `
        <div class="painel-sem-dados">
          <i class="fa-solid fa-database"></i>
          <p>Dados detalhados não disponíveis para este país.<br>
          O mapa exibe dados do Relatório JMP WHO/UNICEF 2022 para os principais países monitorados.</p>
        </div>`;
      return;
    }

    const [nivelTxt, nivelCls] = getNivelTexto(d.aguaSegura);
    painelNivel.textContent = nivelTxt;
    painelNivel.className   = 'painel-pais-nivel ' + nivelCls;

    painelCorpo.innerHTML = `
      <div class="metrica">
        <div class="metrica-titulo"><i class="fa-solid fa-droplet"></i> Água Potável Segura</div>
        <div class="metrica-valor-linha">
          <span class="metrica-num">${d.aguaSegura}%</span>
          <div class="barra-fundo">
            <div class="barra-fill" id="barra-agua" style="width:0%;background:${getCorBarra(d.aguaSegura)}"></div>
          </div>
        </div>
        <div class="metrica-detalhe">da população com acesso a água gerida de forma segura</div>
      </div>

      <div class="metrica">
        <div class="metrica-titulo"><i class="fa-solid fa-toilet"></i> Saneamento Básico</div>
        <div class="metrica-valor-linha">
          <span class="metrica-num">${d.saneamento}%</span>
          <div class="barra-fundo">
            <div class="barra-fill" id="barra-san" style="width:0%;background:${getCorBarra(d.saneamento)}"></div>
          </div>
        </div>
        <div class="metrica-detalhe">da população com saneamento básico adequado</div>
      </div>

      ${d.semAgua !== '0' ? `
      <div class="metrica">
        <div class="metrica-titulo"><i class="fa-solid fa-person-drowning"></i> Sem acesso à água segura</div>
        <div style="font-size:1.8rem;font-weight:800;color:#ef5350">${d.semAgua}</div>
        <div class="metrica-detalhe">de pessoas sem acesso à água potável segura</div>
      </div>` : `
      <div class="metrica">
        <div class="metrica-titulo"><i class="fa-solid fa-circle-check"></i> Cobertura universal</div>
        <div style="font-size:0.9rem;color:#81c784">Acesso universal ou quase universal à água potável segura.</div>
      </div>`}

      <hr class="divisor">

      <p class="painel-resumo">${d.resumo}</p>

      <p class="painel-fonte"><i class="fa-solid fa-book"></i> Fonte: ${d.fonte}</p>
    `;

    // Animar barras com delay
    requestAnimationFrame(() => {
      setTimeout(() => {
        const ba = document.getElementById('barra-agua');
        const bs = document.getElementById('barra-san');
        if (ba) ba.style.width = d.aguaSegura + '%';
        if (bs) bs.style.width = d.saneamento + '%';
      }, 80);
    });
  }

  // Fechar painel
  document.getElementById('btn-fechar-painel').addEventListener('click', () => {
    painelEl.classList.remove('ativo');
  });

  // Fechar painel com ESC
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') painelEl.classList.remove('ativo');
  });
  </script>

</body>
</html>
